<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Outfit";
    src: url("fonts/Outfit.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  html, body { margin: 0; background: #ffffff; }
  .stage {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .lockup {
    position: absolute;
    left: 0; right: 0;
    top: 18px;
    bottom: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .mark { width: 188px; height: 188px; display: block; }
  .word {
    font-family: "Outfit", Arial, sans-serif;
    font-weight: 500;
    font-variation-settings: "wght" 500;
    font-size: 168px;
    line-height: 0.88;
    letter-spacing: -4px;
    margin: 0;
  }
  .tag {
    font-family: "Outfit", Arial, sans-serif;
    font-weight: 400;
    font-variation-settings: "wght" 430;
    font-size: 28px;
    letter-spacing: 0.2px;
    color: #5f6368;
    margin: 2px 0 0;
  }
  .pines {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 96px;
    display: block;
  }
</style>
</head>

</html>
