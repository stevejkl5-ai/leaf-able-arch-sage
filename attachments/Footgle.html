<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Footgle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: início centrado estilo Google; resultados em duas colunas (lista + painel de conhecimento); gaveta lateral para ler/ouvir cada arquivo */
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#202124; --muted:#5f6368; --line:#dadce0; --link:#1a0dab;
  --chip:#f1f3f4; --hover:#f8f9fa; --accent:#1a73e8; --accent-fg:#ffffff; --mark:#fff3b0;
  --shadow:0 1px 6px rgba(32,33,36,.28); --veil:rgba(32,33,36,.45);
  --blue:#4285f4; --red:#ea4335; --yellow:#fbbc05; --green:#34a853;
  --font:Roboto,Arial,sans-serif; --logo:Outfit,"Product Sans",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#202124; --panel:#303134; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --link:#8ab4f8;
  --chip:#303134; --hover:#2b2c2f; --accent:#8ab4f8; --accent-fg:#202124; --mark:#5b4b00;
  --shadow:0 1px 6px rgba(0,0,0,.6); --veil:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202124; --panel:#303134; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --link:#8ab4f8;
  --chip:#303134; --hover:#2b2c2f; --accent:#8ab4f8; --accent-fg:#202124; --mark:#5b4b00;
  --shadow:0 1px 6px rgba(0,0,0,.6); --veil:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.58 var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;fill:currentColor;flex:none}
.logo{font:500 28px/1 var(--logo);letter-spacing:-.5px;white-space:nowrap;background:none;border:0;padding:0}
.logo .c0{color:var(--blue)}.logo .c1{color:var(--red)}.logo .c2{color:var(--yellow)}.logo .c3{color:var(--green)}
.logo.big{font-size:clamp(46px,12.5vw,90px);letter-spacing:-2px}

/* barra de busca */
.sbwrap{position:relative;width:100%;max-width:584px}
.sb{display:flex;align-items:center;gap:12px;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:24px;background:var(--panel);color:var(--muted)}
.sb:hover,.sb:focus-within{box-shadow:var(--shadow);border-color:transparent}
.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:16px var(--font)}
.sb .clr{border:0;background:none;padding:2px;display:none;color:var(--muted)}
.sb.has .clr{display:block}
.sug{position:absolute;left:0;right:0;top:44px;margin:0;padding:8px 0 10px;list-style:none;background:var(--panel);border:1px solid transparent;border-top:0;border-radius:0 0 24px 24px;box-shadow:var(--shadow);z-index:25;display:none}
.sbwrap.open .sb{border-radius:24px 24px 0 0;box-shadow:var(--shadow)}
.sbwrap.open .sug{display:block}
.sug li{display:flex;align-items:center;gap:14px;padding:6px 16px;cursor:pointer;color:var(--fg)}
.sug li svg{color:var(--muted)}
.sug li.on,.sug li:hover{background:var(--hover)}

/* início */
.home .topbar,.home .tabs{display:none}
.homebox{display:none;flex-direction:column;align-items:center;gap:26px;padding-top:min(18vh,150px);padding-bottom:40px;text-align:center}
.home .homebox{display:flex}
.home .serp,.home .player-pad{display:none}
.tagline{color:var(--muted);margin-top:-14px;font-size:15px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--chip);border:1px solid var(--chip);border-radius:4px;padding:9px 16px;color:var(--fg);font-size:14px}
.btn:hover{border-color:var(--line);box-shadow:0 1px 1px rgba(0,0,0,.12)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;display:flex;gap:8px 12px;flex-wrap:wrap;justify-content:center;max-width:620px}
.hint button{border:1px solid var(--line);background:none;border-radius:16px;padding:3px 12px;color:var(--link)}
.hint button:hover{background:var(--hover)}
.foot{border-top:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:14px;margin-top:auto}
.foot .gut{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding-block:14px}
.foot a,.foot button{color:var(--muted);background:none;border:0;padding:0}
.shell{min-height:100vh;display:flex;flex-direction:column}
.home .shell{min-height:calc(100vh - 0px)}
.shellmain{flex:1}

/* topo e abas */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.topbar .gut{display:flex;align-items:center;gap:20px 28px;padding-top:14px;padding-bottom:8px;flex-wrap:wrap}
.topbar .sbwrap{flex:1;min-width:230px;max-width:692px}
.iconbtn{border:0;background:none;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .gut{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px 10px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover:not(.on){color:var(--fg)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:10px;color:var(--muted);font-size:13px}
.tools select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:13px var(--font)}

/* resultados */
.serp{display:grid;gap:0 48px;padding-block:14px 90px;grid-template-areas:"kp" "res"}
.col1{grid-area:res;min-width:0;max-width:652px}
.col2{grid-area:kp;min-width:0}
@media (min-width:1020px){.serp.two{grid-template-columns:minmax(0,652px) minmax(0,400px);grid-template-areas:"res kp";align-items:start}}
.stats{color:var(--muted);font-size:13px;margin:4px 0 12px}
.res{margin:0 0 26px;max-width:652px}
.site{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.fav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:500 12px var(--font);flex:none}
.sname{font-size:14px;line-height:1.2}
.surl{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.res h3{margin:2px 0 3px;font:400 20px/1.3 var(--font)}
.res h3 a{color:var(--link)}
.snip{margin:0;color:var(--muted);max-width:620px}.snip b,.hl b{color:var(--fg);font-weight:500}
.snip .dt{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;align-items:center}
.chip{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--chip);color:var(--muted);border:0}
.act{font-size:13px;border:1px solid var(--line);background:none;border-radius:14px;padding:2px 12px;color:var(--link);display:inline-flex;gap:6px;align-items:center}
.act:hover{background:var(--hover);text-decoration:none}
.act.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.block{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 26px;max-width:652px}
.block h4{margin:0 0 10px;font:500 16px var(--font)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip button{flex:none;width:150px;border:0;padding:0;background:none;text-align:left}
.strip svg{width:150px;height:104px;border-radius:8px;display:block}
.more{display:block;width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--link);text-align:center}
.more:hover{background:var(--hover)}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 12px;color:var(--muted)}
.kp{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:26px;background:var(--panel)}
.kp .hero{height:150px;display:block;width:100%}
.kp .in{padding:14px 18px 18px}
.kp h2{margin:0;font:400 28px/1.2 var(--font)}
.kp .sub{color:var(--muted);margin-bottom:8px}
.kp dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.kp dt{font-weight:500}.kp dd{margin:0;color:var(--muted)}

/* imagens */
.grid{columns:220px;column-gap:12px}
.grid figure{margin:0 0 12px;break-inside:avoid}
.grid button{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.grid svg{width:100%;height:auto;border-radius:10px;display:block}
.grid figcaption{font-size:12px;color:var(--muted);padding:5px 2px 0;line-height:1.35}
.grid figcaption b{display:block;color:var(--fg);font-weight:500;font-size:13px}

/* documentos e áudio */
.dcard{display:grid;grid-template-columns:52px 1fr;gap:6px 16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;max-width:760px}
.pdf{width:52px;height:64px;border-radius:6px;background:var(--red);color:#fff;font:500 13px var(--font);display:grid;place-items:end center;padding-bottom:8px}
.dcard h3{margin:0 0 2px;font:500 16px/1.3 var(--font)}
.dcard .fn{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.arow{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);max-width:760px}
.arow:hover{background:var(--hover)}
.pb{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.arow .t{flex:1;min-width:0}.arow .t b{display:block;font-weight:500}
.arow .t span{color:var(--muted);font-size:13px}

/* linha do tempo */
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 22px;border-left:2px solid var(--line);max-width:700px}
.tl li{position:relative;padding:0 0 22px 18px}
.tl li::before{content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl .d{font:500 13px var(--font);color:var(--accent)}
.tl button{border:0;background:none;padding:0;text-align:left;color:var(--fg);font-size:15px}
.tl button:hover{color:var(--link);text-decoration:underline}

/* gaveta, lightbox, player */
.veil{position:fixed;inset:0;background:var(--veil);z-index:40;display:none}
.veil.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;transform:translateX(105%);transition:transform .22s ease;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);z-index:2}
.db{padding:18px 20px calc(110px + env(safe-area-inset-bottom,0px))}
.db h2{margin:2px 0 10px;font:400 24px/1.3 var(--font)}
.db p{margin:0 0 14px;max-width:62ch}
.db ul{margin:0 0 16px;padding-left:20px}
.db table{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:13px}
.db td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.db td:first-child{color:var(--muted);width:34%}
.db pre{background:var(--chip);padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.5}
.db h5{margin:20px 0 8px;font:500 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
blockquote{margin:0 0 16px;padding:8px 14px;border-left:3px solid var(--accent);background:var(--hover)}
blockquote small{display:block;color:var(--muted)}
.note{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
.rel{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.rel button{flex:none;width:170px;border:0;background:none;padding:0}
.rel svg{width:170px;height:118px;border-radius:8px;display:block}
.lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--veil);padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
.lb.on{display:flex}
.lb .card{background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:100%;overflow-y:auto;padding:14px}
.lb .card svg{width:100%;height:auto;max-height:58vh;border-radius:8px;display:block}
.lb .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.12);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.player.on{display:block}
.player .bar{height:3px;background:var(--line)}.player .bar i{display:block;height:100%;width:0;background:var(--accent)}
.player .gut{display:flex;align-items:center;gap:12px;padding-block:8px}
.player .nm{flex:1;min-width:0;font-size:13px}
.player .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .nm span{color:var(--muted);font-size:12px}
.player select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;font:13px var(--font)}
.empty{color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
@media (max-width:560px){.topbar .gut{gap:8px}.res h3{font-size:18px}.kp .hero{height:110px}}

.langrow{color:var(--muted);font-size:13px}.langrow button{border:0;background:none;color:var(--link);padding:0}.langrow button:hover{text-decoration:underline}

.logo{display:flex;align-items:center}.logo .fi{height:32px;width:auto;margin-right:9px;border-radius:8px}.logo.big{flex-direction:column;gap:10px;line-height:1}.logo.big .fi.big{height:clamp(80px,22vw,120px);margin:0 0 6px}.logo.big .full{width:clamp(150px,44vw,210px);height:auto}
</style>
<div class="shell" id="shell">
  <header class="topbar"><div class="gut">
    <button class="logo" id="logoTop" data-act="home"></button>
    <div id="slotTop" style="flex:1;min-width:230px;max-width:692px;display:flex"></div>
    <button class="iconbtn" data-act="theme" data-al="theme"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9 9 0 0 0 12 3z"/></svg></button>
  </div></header>
  <nav class="tabs" id="tabs"><div class="gut">
    <button data-tab="tudo"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg><span data-i="tab_tudo"></span></button>
    <button data-tab="imagens"><svg class="ico" viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5z"/></svg><span data-i="tab_imagens"></span></button>
    <button data-tab="documentos"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z"/></svg><span data-i="tab_documentos"></span></button>
    <button data-tab="audio"><svg class="ico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><span data-i="tab_audio"></span></button>
    <button data-tab="linha-do-tempo"><svg class="ico" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.8-1.3-3.6-2.1V8z"/></svg><span data-i="tab_linha-do-tempo"></span></button>
  </div></nav>
  <div class="shellmain">
    <section class="homebox gut" id="homebox">
      <div class="logo big" id="logoBig" aria-hidden="true"></div>
      <div class="tagline" data-i="tagline"></div>
      <div id="slotHome" style="width:100%;display:flex;justify-content:center"></div>
      <div class="btns"><button class="btn pri" data-act="search" id="btnSearch"></button><button class="btn" data-act="lucky" data-i="lucky"></button></div>
      <div class="hint" id="hint"></div>
      <div class="langrow" id="langHome"></div>
    </section>
    <main class="serp gut" id="serp"><div class="col2" id="col2"></div><div class="col1" id="col1"></div></main>
  </div>
  <footer class="foot"><div class="gut"><span id="footL"></span><span id="footR"></span></div></footer>
</div>
<div class="veil" id="veil" data-act="close"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="lb" id="lb" data-act="lbclose"></div>
<div class="player" id="player" role="region">
  <div class="bar"><i id="pbar"></i></div>
  <div class="gut">
    <button class="pb" data-act="ptoggle" id="ptoggle" data-al="ptoggle"></button>
    <div class="nm"><b id="ptitle"></b><span id="psub"></span></div>
    <label for="prate" class="chip" data-i="speed"></label>
    <select id="prate"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select>
    <button class="iconbtn" data-act="pstop" data-al="pstop"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
  </div>
</div>

<script>
"use strict";
const SEARCH='<svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>';
const PLAY='<svg class="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg class="ico" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const rnd=seed=>()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
const foot=(x,y,sx,sy,rot,fill)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sx} ${sy})" fill="${fill}"><path d="M-20 40C-24 10-18-30-4-45 6-55 22-50 24-35 28-10 26 30 18 50 10 68-18 66-20 40Z"/><circle cx="-14" cy="-58" r="7"/><circle cx="-2" cy="-66" r="7.5"/><circle cx="10" cy="-64" r="7"/><circle cx="19" cy="-56" r="6"/><circle cx="26" cy="-46" r="5"/></g>`;
const pine=(x,base,h,c)=>{let s='';const w=h*.42;for(let i=0;i<3;i++){const t=base-h*i*.26,hh=h*.5,ww=w*(1-i*.22);s+=`<polygon points="${x},${t-hh} ${x-ww/2},${t} ${x+ww/2},${t}" fill="${c}"/>`}return s+`<rect x="${x-2}" y="${base}" width="4" height="${h*.1}" fill="${c}"/>`};

{id:"usfs-umatilla-1982",title:"Investigação de pegadas do Pé Grande, Floresta Nacional Umatilla (18 jun. 1982)",site:"Serviço Florestal dos EUA (USFS)",abbr:"FS",color:"#2e7d32",src:"usfs",kind:"doc",status:"Documento oficial",url:FOIA,date:"18 de junho de 1982",year:1982,pages:"6",file:"June 18 1982 Bigfoot Tracks Investigation Umatilla NF.pdf",size:"553,74 KB",official:1,
 tags:"pegada pegadas footprint tracks umatilla mill creek johnson biólogo 1982 moldes gesso plaster cast farsa hoax",
 snippet:"Memorando do biólogo Rodney L. Johnson sobre pegadas gigantes na bacia do Mill Creek, com medições, fotos coloridas e moldes de gesso. Ele conclui que as marcas não vieram de uma criatura bípede de mais de 135 kg.",
 body:["Em junho de 1982, o biólogo de vida selvagem Rodney L. Johnson foi designado pelo Departamento de Agricultura para examinar relatos de pegadas atribuídas ao Pé Grande na bacia do Mill Creek, dentro da Floresta Nacional Umatilla. Ele visitou os locais, mediu as marcas, fez fotos coloridas e moldes de gesso.","Uma das pegadas foi descrita com cerca de 15 polegadas, ou 38 centímetros, de comprimento por 7 de largura. Johnson escreveu que, se as marcas fossem falsas, quem as fez teve bastante trabalho.","O memorando conclui que as pegadas não foram feitas por uma criatura bípede de 300 libras ou mais. Segundo a cobertura da imprensa, as botas dos próprios investigadores afundaram mais na lama do que as supostas pegadas.","Um memorando de 28 de julho é citado como a passagem que chama as marcas de uma tentativa muito elaborada de farsa, talvez feita com um pé coberto de gesso mole ou borracha. Parte dos veículos atribui essa frase a outro documento, então vale conferir no PDF.","Nenhum documento liberado diz quem fez as marcas."],
 points:["Autor: Rodney L. Johnson, biólogo","Método: medições, fotos e moldes de gesso","Conclusão: não é criatura bípede de 300 lb ou mais","Autoria das marcas não identificada"],
 note:"A imprensa diverge sobre o estado. A Floresta Nacional Umatilla fica entre o nordeste do Oregon e o sudeste de Washington.",imgs:["im-cast","im-memo","im-chart"]},
{id:"usfs-kinney-petty-creek",title:"Relato de Leo T. Kinney sobre Petty Creek, Montana",site:"Serviço Florestal dos EUA (USFS)",abbr:"FS",color:"#2e7d32",src:"usfs",kind:"doc",status:"Documento oficial",url:FOIA,date:"Escrito em 1980 (fatos de 1949)",year:1980,pages:"6",file:"Kinney_whatdoyouknow_MT.pdf",size:"492,05 KB",official:1,
 tags:"kinney petty creek montana alberton alce elk rastros neve 1949 caçada hunters grunhido",
 snippet:"Texto de seis páginas escrito em 1980 sobre uma caçada em 1949: o grupo achou rastros enormes na neve e só as vísceras de um alce, seguiu a trilha por cerca de meia milha e voltou.",
 body:["O texto foi escrito em 1980 e conta uma viagem de caça que Leo T. Kinney situa em 1949, na região de Petty Creek, perto de Alberton, Montana. Parte da imprensa fala apenas em anos 1940.","Kinney e outras três pessoas foram buscar a carcaça de um alce. Quando chegaram, só restavam as vísceras. Rastros grandes se afastavam pela neve, e ele acreditava que quem os fez tinha carregado a carcaça sem arrastá-la.","O grupo seguiu os rastros por cerca de meia milha, uns 800 metros, e parou. Kinney descreve um som de grunhido e uma sensação de desconforto, com arrepios nas costas. Todos concordaram em voltar."],
 quote:{en:"a very uneasy feeling",pt:"uma sensação muito desconfortável"},points:["Autor: Leo T. Kinney","Local: Petty Creek, Montana","Evento: caçada de 1949, texto de 1980","Rastros seguidos por cerca de 800 m"],imgs:["im-snow","im-forest"]},

{id:"usfs-colecao",title:"Coleção “Bigfoot/Sasquatch Records” na Sala de Leitura FOIA (15 out. 2026)",site:"Serviço Florestal dos EUA (USFS)",abbr:"FS",color:"#2e7d32",src:"usfs",kind:"page",status:"Página oficial",url:FOIA,date:"15 de outubro de 2026",year:2026,pages:"3 arquivos",file:"",size:"",official:1,
 tags:"coleção sala de leitura foia reading room 2026 usda divulgação washington office registros bigfoot sasquatch records",
 snippet:"Entrada publicada pelo escritório de Washington do Serviço Florestal, na área de Bacias, Peixes, Vida Selvagem, Ar e Plantas Raras, com três PDFs sobre relatos do Pé Grande.",
 body:["Em 15 de outubro de 2026, o Serviço Florestal publicou na sua Sala de Leitura FOIA uma entrada chamada Bigfoot/Sasquatch Records, com três PDFs. A divulgação foi feita sem anúncio, e a imprensa só repercutiu depois que o Washington Post noticiou.","Os arquivos registram relatos e investigações de campo. Nenhum deles confirma a existência da criatura. O Serviço Florestal não respondeu ao pedido de comentário da Fox News sobre o motivo da divulgação.","Em outro episódio citado pela cobertura, funcionários da Floresta Nacional Stanislaus, na Califórnia, fizeram um fórum local sobre avistamentos e disseram que a agência não podia confirmar nem negar a existência do Pé Grande."],
 points:["Data de publicação: 15 de outubro de 2026","Três PDFs: 1982, 2003 e o relato de Kinney","Posição do Serviço Florestal: nem confirma nem nega"],imgs:["im-forest","im-sunset"]},
{id:"fbi-vault",title:"FBI Records: The Vault, arquivo “Bigfoot” (1976–1977)",site:"FBI Records: The Vault",abbr:"FBI",color:"#1a3a6b",src:"fbi",kind:"doc",status:"Documento oficial",url:"https://vault.fbi.gov/bigfoot/bigfoot-part-01-of-01/view",date:"Documentos de 1976–77, publicados em 5 de junho de 2019",year:1977,pages:"22",file:"Bigfoot Part 01 of 01",size:"",official:1,
 tags:"fbi vault pelo cabelo hair byrne peter cochran veado deer cervídeo bigfoot information center the dalles oregon 1976 1977 academy of applied science",
 snippet:"22 páginas sobre o pedido de 1976 para o FBI analisar 15 fios presos a um pedaço de pele. O laboratório concluiu em 1977 que os pelos eram de cervídeo.",
 body:["Em agosto de 1976, Peter Byrne, diretor do Bigfoot Information Center and Exhibition, em The Dalles, Oregon, escreveu ao FBI. Ele queria saber se o FBI já tinha analisado pelos atribuídos ao Pé Grande e pediu o exame de uma amostra: cerca de 15 fios presos a um pequeno pedaço de pele.","O FBI disse a princípio que não achava registro de exames anteriores, mas aceitou analisar a amostra depois de atenção da imprensa. Em fevereiro de 1977, o assistente de diretor Jay Cochran Jr. respondeu que os pelos eram de cervídeos e devolveu o material.","O arquivo reúne cartas, recortes de jornal e fotos dos pelos ao lado de uma régua métrica. Foi publicado no Vault em 5 de junho de 2019.","Um relatório de laboratório citado por um atlas de 1975, que falava em pelos sem correspondência em nenhum animal conhecido, não aparece no arquivo. O FBI disse ao pesquisador John Greenewald Jr. que entregou tudo o que encontrou."],
 quote:{en:"the hairs are of deer family origin",pt:"os pelos são de origem da família dos cervos"},points:["Pedido: Peter Byrne, agosto de 1976","Amostra: 15 fios e um pedaço de pele","Resultado: cervídeo (fevereiro de 1977)","Publicado em 5 de junho de 2019"],imgs:["im-hair","im-fbi"]},

 snippet:"Jaula de madeira montada em floresta nacional do Oregon para capturar um Pé Grande. Não funcionou, foi abandonada no início dos anos 1980 e hoje é mantida como atração.",
 body:["A armadilha do Pé Grande fica na Floresta Nacional Rogue River, no Oregon, perto da trilha Collings Mountain. Ela não capturou nada e foi abandonada no início dos anos 1980.","Com o tempo, a estrutura se deteriorou. Hoje ela é mantida como curiosidade. Uma pasta chamada Grouse Creek Big Foot Trap, do Distrito de Applegate, aparece no acervo da Southern Oregon University."],

const BRIEF_PT="Resumo em um minuto. Em quinze de outubro de dois mil e vinte e seis, o Serviço Florestal dos Estados Unidos publicou três arquivos sobre o Pé Grande na sua Sala de Leitura de acesso à informação. O principal é um memorando de mil novecentos e oitenta e dois, do biólogo Rodney Johnson, sobre pegadas de cerca de quinze polegadas na Floresta Nacional Umatilla. Ele concluiu que não foram feitas por uma criatura bípede grande e que, se eram falsas, deram trabalho. Os outros dois arquivos vêm de Montana: um relato de Leo Kinney sobre rastros na neve em mil novecentos e quarenta e nove e uma matéria de jornal de dois mil e três. Antes disso, em dois mil e dezenove, o FBI publicou um arquivo de vinte e duas páginas: em mil novecentos e setenta e sete, o laboratório concluiu que os supostos pelos do Pé Grande eram de cervídeo. Nenhum documento confirma a existência da criatura.";

"usfs-umatilla-1982":{title:"Bigfoot Tracks Investigation, Umatilla National Forest (June 18, 1982)",site:"U.S. Forest Service (USFS)",status:"Official record",date:"June 18, 1982",size:"553.74 KB",
 snippet:"Memo by wildlife biologist Rodney L. Johnson on giant tracks in the Mill Creek watershed, with measurements, color photos and plaster casts. He concludes a two-legged creature of 300 lb or more did not make them.",
 body:["In June 1982, wildlife biologist Rodney L. Johnson was assigned by the U.S. Department of Agriculture to look into reported Bigfoot tracks in the Mill Creek watershed of the Umatilla National Forest. He visited the sites, measured the prints, took color photographs and made plaster casts.","One print was described as roughly 15 inches (38 cm) long and 7 inches (18 cm) wide. Johnson wrote that if the tracks were faked, whoever made them went to considerable trouble.","The memo concludes the tracks were not made by a two-legged creature weighing 300 pounds or more. According to news coverage, the investigators' own boots sank deeper into the mud than the alleged prints.","A July 28 memo is cited as the passage calling the marks a very clever attempt at a hoax, possibly made with a foot coated in soft plaster or rubber. Some outlets attribute that line to a different document, so check the PDF.","None of the released documents says who made the marks."],
 points:["Author: Rodney L. Johnson, wildlife biologist","Method: measurements, photos and plaster casts","Conclusion: not a two-legged creature of 300 lb or more","Maker of the tracks never identified"],
 note:"Press reports disagree on the state. The Umatilla National Forest spans northeast Oregon and southeast Washington."},
"usfs-kinney-petty-creek":{title:"Leo T. Kinney's Account of Petty Creek, Montana",site:"U.S. Forest Service (USFS)",status:"Official record",date:"Written in 1980 (events of 1949)",size:"492.05 KB",
 snippet:"Six-page account written in 1980 about a 1949 hunting trip: the party found huge tracks in the snow and only the entrails of an elk, followed the trail about half a mile and turned back.",
 body:["The account was written in 1980 and tells of a hunting trip Kinney places in 1949 (some press reports say only the 1940s) near Petty Creek, close to Alberton, Montana.","Kinney and three other people went to retrieve an elk carcass. When they arrived, only the entrails were left. Large tracks led away through the snow, and he believed whatever made them had carried the carcass off the ground.","The group followed the tracks for about half a mile and stopped. Kinney describes a grunting sound and an uneasy feeling, with chills down their backs. Everyone agreed to turn back."],
 points:["Author: Leo T. Kinney","Place: Petty Creek, Montana","Event: 1949 hunt, written in 1980","Tracks followed about half a mile"]},
"usfs-clarkfork-2003":{title:"Clark Fork Valley Press article (Jan. 13, 2003)",site:"U.S. Forest Service (USFS)",status:"Official record",date:"January 13, 2003",pages:"not listed",size:"374.61 KB",
 snippet:"Local newspaper clipping about mystery prints and a sighting report in Sanders County, Montana, kept in Forest Service records.",
 body:["The third file in the collection is a clipping from the local Clark Fork Valley Press, dated January 13, 2003. Coverage describes it as a story about mysterious prints and a sighting in Sanders County, Montana.","This summary comes from news coverage. For the exact content of the clipping, see the original PDF."],
 points:["Newspaper: Clark Fork Valley Press","Place: Sanders County, Montana","Date: January 13, 2003"]},
"usfs-colecao":{title:"“Bigfoot/Sasquatch Records” in the FOIA Reading Room (Oct. 15, 2026)",site:"U.S. Forest Service (USFS)",status:"Official page",date:"October 15, 2026",pages:"3 files",
 snippet:"Entry posted by the Forest Service's Washington Office, under Watershed, Fish, Wildlife, Air, and Rare Plants, with three PDFs of Bigfoot reports.",
 body:["On October 15, 2026, the Forest Service posted an entry called Bigfoot/Sasquatch Records in its FOIA Reading Room, with three PDFs. There was no announcement, and the press only picked it up after The Washington Post reported on it.","The files record reports and field investigations. None of them confirms the creature exists. The Forest Service did not respond to Fox News about why the files came out now.","In another episode noted by news coverage, staff at California's Stanislaus National Forest held a local forum on sightings and said the agency could neither confirm nor deny that Bigfoot exists."],
 points:["Posted: October 15, 2026","Three PDFs: 1982, 2003 and Kinney's account","Forest Service position: neither confirms nor denies"]},
"fbi-vault":{title:"FBI Records: The Vault, “Bigfoot” file (1976–1977)",site:"FBI Records: The Vault",status:"Official record",date:"Records from 1976–77, released June 5, 2019",
 snippet:"22 pages on a 1976 request for the FBI to test 15 hairs attached to a bit of skin. The lab concluded in 1977 the hairs were from the deer family.",
 body:["In August 1976, Peter Byrne, director of the Bigfoot Information Center and Exhibition in The Dalles, Oregon, wrote to the FBI. He asked whether the FBI had ever tested hair attributed to Bigfoot and requested an exam of a sample: about 15 hairs attached to a small piece of skin.","The FBI first said it could find no record of earlier exams, but agreed to test the sample after press attention. In February 1977, Assistant Director Jay Cochran Jr. replied that the hairs were of deer family origin and returned the material.","The file includes letters, newspaper clippings and photos of the hairs next to a metric ruler. It was posted to the Vault on June 5, 2019.","A lab report cited by a 1975 atlas, which spoke of hair matching no known animal, does not appear in the file. The FBI told researcher John Greenewald Jr. it had handed over everything it found."],
 points:["Request: Peter Byrne, August 1976","Sample: 15 hairs and a bit of skin","Result: deer family (February 1977)","Released June 5, 2019"]},
"blackvault-fbi":{title:"The Black Vault: FBI Files, Bigfoot & Sasquatch",site:"The Black Vault",status:"FOIA mirror",date:"May 2019 (archive page)",size:"14.3 MB",
 snippet:"A copy of the same material obtained by John Greenewald Jr. through a FOIA request: 24 pages, 14.3 MB. He also asked for the results cited in the 1975 atlas, and the FBI said it could not find them.",
 body:["The Black Vault, run by John Greenewald Jr., hosts the FBI's Bigfoot file obtained through a records request: 24 pages, 14.3 MB.","Greenewald asked the FBI for the analysis mentioned in a 1975 atlas and for any other records. According to him, the FBI replied it had handed over everything it found, and the results of that analysis did not turn up."],
 points:["24 pages, 14.3 MB","Obtained by FOIA request","Report cited in the 1975 atlas not located"]},
"blackvault-atlas":{title:"1975 Environmental Atlas of Washington: Bigfoot References",site:"The Black Vault",status:"Mirror of public document",date:"1975",pages:"not listed",
 snippet:"The atlas includes a sightings map, text and drawings about Bigfoot and says the FBI tested hair matching no known animal.",
 body:["The 1975 environmental atlas of Washington has a section on Sasquatch, with a sightings map, text and drawings. According to coverage, the document is attributed to the Army Corps of Engineers.","The atlas says the FBI analyzed hair attributed to Bigfoot and found it matched no human or known animal. That result was never found in FBI records, and the 1977 analysis pointed to deer hair."],
 points:["Year: 1975","Includes a sightings map","Cites an FBI analysis that was never located"]},
"nps-yellowstone":{title:"Unexplained and Unreported Phenomenon in Yellowstone (park archives)",site:"National Park Service",status:"Official page",date:"December 10, 2013",
 snippet:"Post from the park archives about letters from people asking about Sasquatch sightings. Rangers' replies said no references were found in the natural history records.",
 body:["A 2013 post from the Yellowstone archives, written by an intern, explains the park keeps letters from people around the world and the chief rangers' replies, with questions ranging from the mundane to the unusual.","In one reply, a ranger named Hobbs says he found no references to Bigfoot sightings in the park's historical natural history records. The archives hold no proof of sightings."],
 points:["Author: Hannah Marshall, archives intern","Letters and ranger replies","No sighting records"]},
"loc-afc":{title:"On the Trail of Bigfoot in the Library of Congress",site:"Library of Congress, American Folklife Center",status:"Official page",date:"May 2024",
 snippet:"Blog post from the American Folklife Center about Bigfoot stories found in the collections while the team built a research guide on national heritage areas.",
 body:["The American Folklife Center blog tells how research on historic landscapes and traditional practices ended up as a search for Bigfoot, starting from a hit on the word Tacoma.","Colleagues pointed to the archive's subject files, where stories and records on the topic are kept."],
 points:["Institution: Library of Congress","May 2024","Folklore records and subject files"]},
"rogue-trap":{title:"Bigfoot Trap, Rogue River National Forest (Oregon)",site:"Wikipedia, citing Forest Service pages",status:"Encyclopedia",date:"Abandoned in the early 1980s",
 snippet:"Wooden cage built in an Oregon national forest to catch a Bigfoot. It caught nothing, was abandoned in the early 1980s and is now kept as an attraction.",
 body:["The Bigfoot trap sits in the Rogue River National Forest in Oregon, near the Collings Mountain trail. It never caught anything and was abandoned in the early 1980s.","Over time the structure deteriorated. Today it is kept as a curiosity. A folder called Grouse Creek Big Foot Trap, from the Applegate Ranger District, appears in the Southern Oregon University archive."],
 points:["Place: Rogue River NF, Oregon","Abandoned in the early 1980s","Now an attraction"]},
"usda-aprilfools":{title:"Forest Service “Mythical Wildlife Division” (April Fools' joke)",site:"USDA",status:"Humor",date:"April 1 (year not shown on the page)",
 snippet:"Humor piece from the USDA that “confirms” Bigfoot and offers safety tips. The page's own web address reveals it as an April Fools' prank.",
 body:["The USDA posted a tongue-in-cheek page in which a researcher from a so-called Mythical Wildlife Division confirms Bigfoot and gives safety tips for visiting national forests.","The page's own web address says it was an April Fools' joke. It is not a research document."],
 points:["April Fools' joke","Not evidence of anything","The trail safety tips are real for any hike"]},
"stanislaus-forum":{title:"“Bigfoot in Your Backyard” forum, Stanislaus National Forest (California)",site:"News coverage (Fox News and affiliates)",status:"News coverage",date:"Year not given",
 snippet:"Forest Service staff held a local forum on sightings and said the agency could neither confirm nor deny Bigfoot.",
 body:["Coverage from Fox News and affiliates recalls that staff at the Stanislaus National Forest held a forum called Bigfoot in Your Backyard to discuss local sightings.","At the time, the agency said it could neither confirm nor deny that Bigfoot exists. The articles do not give the date of the event."],
 points:["Place: Stanislaus NF, California","Agency position: neither confirms nor denies"]},
"news-ktvz":{status:"News coverage",date:"November 21, 2026",
 snippet:"Report on the release, focused on the June 18, 1982 memo about tracks along Low Creek in northeast Oregon.",
 body:["KTVZ highlights the Oregon case: the June 18, 1982 memo says the tracks along Low Creek looked unusual but were not made by a two-legged creature of 300 pounds or more.","The report notes the records show how staff assessed the reports and are not proof that Bigfoot exists."],points:["Focus: the 1982 memo","Published November 21, 2026"]},
"news-kptv":{status:"News coverage",date:"November 20, 2026",
 snippet:"Report detailing the three files: Kinney's 1949 trail, the 15-inch prints of 1982 and the memo that mentions an elaborate hoax.",
 body:["KPTV summarizes the three files: the Petty Creek history, the 2003 clipping and the 1982 investigation. It cites prints of about 15 inches and the July 28 memo that mentions an elaborate hoax.","The records document reports and the investigators' doubts, without establishing that Bigfoot exists."],points:["Published November 20, 2026","Summary of all three files"]},
"news-outside":{status:"News coverage",date:"November 20, 2026",

 body:["Outside published a summary of the three files, with cases in Washington, Oregon and Montana, and the story of the missing elk.","The article says the public can read the files on the Forest Service website."],points:["Published November 20, 2026"]}

    rs.forEach((d,i)=>{h+=resHtml(d,terms);if(i===1&&ims.length)h+=`<div class="block"><h4>${t("imgBlock")}</h4><div class="strip">${ims.map(m=>`<button data-act="img" data-id="${m.id}" aria-label="${esc(IMV(m).title)}">${imgSvg(m)}</button>`).join("")}</div><button class="more" data-act="tab" data-t="imagens">${t("seeAll")}</button></div>`;if(i===2||(rs.length<3&&i===rs.length-1))h+=`<div class="block"><h4>${t("paa")}</h4>${FAQ().map(q=>`<details><summary>${q[0]}</summary><p>${q[1]} <a href="#doc-${q[2]}">${t("seeFile")}</a></p></details>`).join("")}</div>`});
  }else if(S.tab==="imagens"){const ims=rank(IM,terms);h=`<div class="stats">${t("imgStats",ims.length)}</div>`+(ims.length?`<div class="grid">${ims.map(m=>{const v=IMV(m);return`<figure><button data-act="img" data-id="${m.id}" aria-label="${esc(v.title)}">${imgSvg(m)}</button><figcaption><b>${esc(v.title)}</b>${esc(v.caption)}</figcaption></figure>`}).join("")}</div>`:`<div class="empty">${t("noImg",esc(S.q))}</div>`);col1.style.maxWidth="none"}
  else if(S.tab==="documentos"){const rs=filt(rank(DOCS.filter(d=>d.kind==="doc"||d.kind==="archive"),terms));h=toolsHtml()+`<div class="stats">${t("docStats",rs.length)}</div>`+(rs.map(d=>{const v=V(d);return`<div class="dcard"><div class="pdf">PDF</div><div><h3><a href="#doc-${d.id}">${hl(v.title,terms)}</a></h3><div class="fn">${esc(d.file)}${v.size?" · "+v.size:""}${/^\d+$/.test(v.pages||"")?" · "+v.pages+" "+t("pagesShort"):""}</div><div class="snip">${hl(v.snippet,terms)}</div><div class="chips"><span class="chip">${esc(v.status)}</span><span class="chip">${esc(v.date)}</span></div><div class="chips"><a class="act" href="#doc-${d.id}">${t("read")}</a><button class="act" data-act="play" data-id="${d.id}" data-p="${d.id}">${PLAY} ${t("listen")}</button><a class="act" href="${d.url}" target="_blank" rel="noopener">${t("openOrig")}</a></div></div></div>`}).join("")||`<div class="empty">${t("noDoc")}</div>`)}
  else if(S.tab==="audio"){const rs=filt(rank(DOCS.filter(d=>d.kind!=="news"),terms));S.allq=["briefing",...rs.map(d=>d.id)];h=`<div class="stats">${t("audStats")}</div><div class="chips" style="margin-bottom:12px"><button class="act on" data-act="playall" style="padding:6px 16px">${PLAY} ${t("playAll")}</button></div><div class="arow"><button class="pb" data-act="play" data-id="briefing" data-p="briefing" aria-label="${t("briefT")}">${PLAY}</button><div class="t"><b>${t("briefT")}</b><span>${t("briefS")} · ${dur("briefing")}</span></div></div>`+rs.map(d=>{const v=V(d);return`<div class="arow"><button class="pb" data-act="play" data-id="${d.id}" data-p="${d.id}" aria-label="${esc(v.title)}">${PLAY}</button><div class="t"><b>${hl(v.title,terms)}</b><span>${esc(v.site)} · ${dur(d.id)}</span></div></div>`}).join("")}
  else{h=`<div class="stats">${t("tlStats")}</div><ol class="tl">${TL().map(x=>`<li><div class="d">${x[0]}</div><button data-act="open" data-id="${x[2]}">${esc(x[1])}</button></li>`).join("")}</ol>`}
  serp.classList.toggle("two",two);col1.innerHTML=h;
  const fs=$("#fsrc"),fp=$("#fper");if(fs){fs.value=S.src;fp.value=S.per}
  syncPlayerUI();
}
function relImgs(ids){return ids.length?`<h5>${t("relImgs")}</h5><div class="rel">${ids.map(i=>{const m=IM.find(x=>x.id===i);return`<button data-act="img" data-id="${i}" aria-label="${esc(IMV(m).title)}">${imgSvg(m)}</button>`}).join("")}</div>`:""}
function drawerDoc(d0){const d=V(d0);const rows=[[t("rSource"),d.site],[t("rType"),d.status],[t("rDate"),d.date],d.pages?[t("rPages"),d.pages]:null,d.file?[t("rFile"),d.file]:null,d.size?[t("rSize"),d.size]:null].filter(Boolean);
return`<div class="dh"><span class="chip">${esc(d.status)}</span><button class="iconbtn" data-act="close" aria-label="${t("close")}">${XI}</button></div><div class="db"><div class="sname" style="color:var(--muted)">${esc(d.site)}</div><h2>${esc(d.title)}</h2><div class="chips" style="margin:0 0 16px"><button class="act on" data-act="play" data-id="${d.id}" data-p="${d.id}" style="padding:6px 16px">${PLAY} ${t("listen")} (${dur(d.id)})</button><a class="act" href="${d.url}" target="_blank" rel="noopener" style="padding:6px 16px">${t("openOrig")}</a></div>${d.body.map(p=>`<p>${esc(p)}</p>`).join("")}${d.quote?`<blockquote>“${esc(d.quote.en)}”<small>${S.lang==="pt"?esc(d.quote.pt)+" (":"("}${t("quoteNote")})</small></blockquote>`:""}<h5>${t("kpoints")}</h5><ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>${d.note?`<div class="note">${esc(d.note)}</div>`:""}<h5>${t("ficha")}</h5><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>${relImgs(d.imgs)}<div class="note" style="margin-top:18px">${t("disc")}</div></div>`}
function drawerAbout(){const ex=JSON.stringify({id:"fbi-vault",title:"FBI Records: The Vault, Bigfoot file",site:"FBI Records: The Vault",kind:"doc",date:"1976–77",year:1977,pages:"22",file:"Bigfoot Part 01 of 01",url:"https://vault.fbi.gov/…",tags:"fbi hair byrne deer…",snippet:"…",body:["…"],points:["…"],imgs:["im-hair"]},null,1);
return`<div class="dh"><b>${t("abT")}</b><button class="iconbtn" data-act="close" aria-label="${t("close")}">${XI}</button></div><div class="db"><h2>${NAME[S.lang]}</h2><p>${t("abIntro")}</p><h5>${t("abH1")}</h5><p>${t("abP1")}</p><pre>${esc(ex)}</pre><div class="chips"><button class="act" data-act="copyjson">${t("copyJ")}</button><span class="chip" id="cpmsg"></span></div><h5>${t("abH2")}</h5><ul>${t("abL").map(x=>`<li>${x}</li>`).join("")}</ul></div>`}
function openDrawer(html){const d=$("#drawer");d.innerHTML=html;d.classList.add("on");d.setAttribute("aria-hidden","false");$("#veil").classList.add("on");d.scrollTop=0;syncPlayerUI()}
function closeDrawer(){$("#drawer").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");$("#veil").classList.remove("on")}
function openImg(id){const m=IM.find(x=>x.id===id),v=IMV(m);S.lb=id;const lb=$("#lb");lb.innerHTML=`<div class="card" data-act="stop"><div class="row"><b>${esc(v.title)}</b><button class="iconbtn" data-act="lbclose" aria-label="${t("closeImg")}">${XI}</button></div>${imgSvg(m)}<p style="color:var(--muted);margin:10px 0 8px">${esc(v.caption)} <i>${t("illus")}</i></p><div class="chips">${m.docs.map(i=>{const d=V(DOCS.find(x=>x.id===i));return`<button class="act" data-act="open" data-id="${i}">${t("seeF")}${esc(d.title.slice(0,46))}…</button>`}).join("")}</div></div>`;lb.classList.add("on")}

/* ---------- áudio ---------- */
let gen=0;const P={queue:[],qi:0,sents:[],si:0,state:"idle",rate:1,id:null,msg:""};
function scriptFor(id){if(id==="briefing")return BRIEF();const d=V(DOCS.find(x=>x.id===id));return d.title+". "+d.body.join(" ")}
const splitS=x=>(x.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g)||[x]).map(s=>s.trim()).filter(Boolean);
const vlang=()=>S.lang==="en"?"en-US":"pt-BR";
function voice(){const v=speechSynthesis.getVoices(),L=vlang();return v.find(x=>x.lang===L)||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith(L.slice(0,2)))||null}
function load(i){P.qi=i;P.id=P.queue[i];P.sents=splitS(scriptFor(P.id));P.si=0}
function speak(){if(P.state!=="playing")return;if(P.si>=P.sents.length){if(P.qi+1<P.queue.length){load(P.qi+1);syncPlayerUI();speak()}else stopAudio();return}
  const g=gen,u=new SpeechSynthesisUtterance(P.sents[P.si]);u.lang=vlang();const v=voice();if(v)u.voice=v;u.rate=P.rate;
  u.onend=()=>{if(g!==gen)return;P.si++;syncPlayerUI();speak()};u.onerror=e=>{if(g!==gen||e.error==="canceled"||e.error==="interrupted")return;stopAudio()};speechSynthesis.speak(u)}
function playAudio(id,queue){if(!("speechSynthesis"in window)){P.msg=t("noTTS");syncPlayerUI();return}P.msg="";
  if(P.id===id&&P.state==="playing"&&!queue){pauseAudio();return}
  if(P.id===id&&P.state==="paused"&&!queue){resumeAudio();return}
  gen++;speechSynthesis.cancel();P.queue=queue||[id];load(0);P.state="playing";syncPlayerUI();speak()}
function pauseAudio(){gen++;speechSynthesis.cancel();P.state="paused";syncPlayerUI()}
function resumeAudio(){P.state="playing";syncPlayerUI();speak()}
function stopAudio(){gen++;try{speechSynthesis.cancel()}catch(e){}P.state="idle";P.id=null;P.msg="";syncPlayerUI()}
function syncPlayerUI(){const pl=$("#player"),on=P.state!=="idle";pl.classList.toggle("on",on||!!P.msg);
  if(on){const d=P.id==="briefing"?{title:t("briefT")}:V(DOCS.find(x=>x.id===P.id));$("#ptitle").textContent=d.title;$("#psub").textContent=(P.state==="playing"?t("playing"):t("paused"))+" · "+t("part",Math.min(P.si+1,P.sents.length),P.sents.length)+(P.queue.length>1?t("track",P.qi+1,P.queue.length):"");$("#pbar").style.width=(P.si/P.sents.length*100)+"%"}
  else{$("#ptitle").textContent="";$("#psub").textContent=P.msg;$("#pbar").style.width="0"}
  $("#ptoggle").innerHTML=P.state==="playing"?PAUSE:PLAY;
  $$("[data-p]").forEach(b=>{const act=P.id===b.dataset.p&&P.state==="playing";b.innerHTML=(act?PAUSE:PLAY)+(b.classList.contains("pb")?"":" "+t(act?"pauseL":"listen")+(b.dataset.long||""))})}

/* ---------- eventos ---------- */
function setTheme(x){document.documentElement.dataset.theme=x;try{localStorage.setItem("pg-theme",x)}catch(e){}}
try{const x=localStorage.getItem("pg-theme");if(x)document.documentElement.dataset.theme=x}catch(e){}
function submit(){S.q=$("#q").value.trim();closeSug();S.started=true;go(TABS.includes(S.tab)?S.tab:"tudo")}
document.addEventListener("click",e=>{
  const x=e.target.closest("[data-act],[data-tab]");
  if(!e.target.closest("#sbwrap"))closeSug();
  if(!x)return;if(x.dataset.tab){go(x.dataset.tab);return}
  const a=x.dataset.act,id=x.dataset.id;
  if(a==="stop")return;
  if(a==="home"){S.started=false;S.q="";history.replaceState(null,"",location.pathname);render()}
  else if(a==="search")submit();
  else if(a==="lucky"){const o=DOCS.filter(d=>d.official);go("doc-"+o[Math.floor(Math.random()*o.length)].id)}
  else if(a==="query"){S.q=x.dataset.q;S.started=true;S.tab="tudo";go("tudo")}
  else if(a==="clear"){S.q="";$("#q").value="";SB.querySelector(".sb").classList.remove("has");$("#q").focus();if(S.started)renderSerp()}
  else if(a==="theme"){const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");setTheme(cur==="dark"?"light":"dark")}
  else if(a==="lang"){stopAudio();S.lang=S.lang==="en"?"pt":"en";try{localStorage.setItem("pg-lang",S.lang)}catch(err){}S.q="";applyLang();render()}
  else if(a==="tools"){S.tools=!S.tools;renderSerp()}
  else if(a==="tab"){go(x.dataset.t)}
  else if(a==="img"){openImg(id)}
  else if(a==="lbclose"){$("#lb").classList.remove("on")}
  else if(a==="open"){$("#lb").classList.remove("on");go("doc-"+id)}
  else if(a==="close"){location.hash=S.tab}
  else if(a==="play"){playAudio(id)}
  else if(a==="playall"){playAudio("briefing",S.allq||["briefing"])}
  else if(a==="ptoggle"){if(P.state==="playing")pauseAudio();else if(P.state==="paused")resumeAudio()}
  else if(a==="pstop"){stopAudio()}
  else if(a==="copyjson"){const txt=JSON.stringify(DOCS.map(d=>{const{_t,_g,_s,_b,...r}=V(d);return r}),null,1);const m=$("#cpmsg");const ok=()=>{m.textContent=t("copied")};const no=()=>{m.textContent=t("copyFail")};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(err){no()}}
});
document.addEventListener("change",e=>{if(e.target.id==="fsrc"){S.src=e.target.value;renderSerp()}if(e.target.id==="fper"){S.per=e.target.value;renderSerp()}if(e.target.id==="prate"){P.rate=+e.target.value;if(P.state==="playing"){gen++;speechSynthesis.cancel();speak()}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb").classList.contains("on"))$("#lb").classList.remove("on");else if($("#drawer").classList.contains("on"))location.hash=S.tab}});
window.addEventListener("hashchange",render);
let si=-1,sl=[];
function closeSug(){SB.classList.remove("open");si=-1}
function openSug(){const n=norm($("#q").value).trim();const all=SUGG();sl=(n?all.filter(s=>norm(s).includes(n)||parseQ(n).every(x=>norm(s).includes(x))):all).slice(0,7);if(!sl.length){closeSug();return}
  $("#sug").innerHTML=sl.map((s,i)=>`<li role="option" data-i="${i}" class="${i===si?"on":""}">${SEARCH}<span>${esc(s)}</span></li>`).join("");SB.classList.add("open")}
document.addEventListener("mousedown",e=>{const li=e.target.closest("#sug li");if(li){e.preventDefault();$("#q").value=sl[+li.dataset.i];submit()}});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;SB.querySelector(".sb").classList.toggle("has",!!e.target.value);si=-1;openSug();if(S.started){clearTimeout(window._dt);window._dt=setTimeout(()=>{S.q=e.target.value.trim();renderSerp()},160)}});
document.addEventListener("focusin",e=>{if(e.target.id==="q")openSug()});
document.addEventListener("keydown",e=>{if(e.target.id!=="q")return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!SB.classList.contains("open"))openSug();e.preventDefault();si=(si+(e.key==="ArrowDown"?1:-1)+sl.length)%sl.length;$$("#sug li").forEach((li,i)=>li.classList.toggle("on",i===si));if(sl[si])$("#q").value=sl[si]}else if(e.key==="Enter"){e.preventDefault();submit()}});
if(location.hash&&(TABS.includes(location.hash.slice(1))||location.hash.startsWith("#doc-")||location.hash==="#sobre"))S.started=true;
applyLang();render();
</script>

</body></html>
